<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QA Recorder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="app-shell">

  <div class="titlebar">
    <div class="titlebar-left">
      <span class="titlebar-icon">⬡</span>
      <span class="titlebar-title">QA Recorder</span>
      <span class="titlebar-tab" id="target-tab-label">—</span>
    </div>

    <div class="titlebar-right">
      <button class="tb-btn" id="btn-toggle-meta" title="Hide / show run information">Info</button>
      <button class="tb-btn" id="btn-toggle-json" title="Show / hide JSON preview">JSON</button>
      <button class="tb-btn" id="btn-toggle-size" title="Minimize / maximize layout" style="display:none;">▣</button>
      <button class="tb-btn" id="btn-clear" title="Clear current run">↺</button>
      <button class="tb-btn danger" id="btn-close" title="Close recorder">✕</button>
    </div>
  </div>

  <div class="main-scroll" id="main-scroll">

    <section class="meta-section" id="meta-section">
      <div class="section-head">
        <span class="section-title">Run Information</span>
        <button class="section-toggle" id="btn-meta-collapse">Hide</button>
      </div>

      <div class="field-row">
        <label class="field-label required">Run Name</label>
        <input id="run-name" class="field-input" type="text" placeholder="e.g. Login Flow — Happy Path" autocomplete="off">
      </div>

      <div class="field-row two-col">
        <div class="field-group">
          <label class="field-label">Run Type</label>
          <select id="run-type" class="field-select">
            <option value="manual">Manual</option>
            <option value="regression">Regression</option>
            <option value="smoke">Smoke</option>
            <option value="e2e">E2E</option>
          </select>
        </div>
        <div class="field-group">
          <label class="field-label">Tags</label>
          <input id="run-tags" class="field-input" type="text" placeholder="login, auth, critical" autocomplete="off">
        </div>
      </div>

      <div class="field-row" style="display:none;">
        <label class="field-label">Result Statement</label>
        <textarea id="run-result" class="field-textarea" rows="2" placeholder="User can log in with valid credentials"></textarea>
      </div>
    </section>

    <div class="scenario-bar">
      <div id="scenario-tabs" class="scenario-tabs"></div>
      <button class="add-scenario-btn" id="btn-add-scenario">+ Scenario</button>
    </div>

    <div class="scenario-body" id="scenario-body">
      <div class="empty-state">
        <p>No scenarios yet.</p>
        <p>Click <strong>+ Scenario</strong> to begin.</p>
      </div>
    </div>

    <div class="capture-panel" id="capture-panel" style="display:none">
      <div class="cp-info">
        <span class="cp-field-name" id="cp-field-name">—</span>
        <span class="cp-field-type" id="cp-field-type"></span>
      </div>

      <div class="cp-buttons" style="display:none;">
        <button class="cp-btn locator" id="btn-capture-locator" title="Capture CSS/XPath selector">🎯 Locator</button>
        <button class="cp-btn value" id="btn-capture-value" title="Capture element value / text">📋 Value</button>
        <button class="cp-btn both" id="btn-capture-both" title="Capture locator AND value together">⚡ Both</button>
        <button class="cp-btn cancel" id="btn-capture-cancel" title="Cancel capture">✕ Cancel</button>
      </div>

      <div class="alt-locators" id="alt-locators" style="display:none">
        <p class="alt-header">Alternative locators:</p>
        <div id="alt-list"></div>
      </div>
    </div>

    <div class="payload-pane" id="payload-pane" style="display:none">
      <div class="payload-header">
        <span>JSON Preview</span>
        <button class="cp-btn" id="btn-copy-payload">Copy</button>
      </div>
      <pre id="payload-content" class="payload-content"></pre>
    </div>
  </div>

  <div class="action-bar">
    <span class="save-status" id="save-status">● Unsaved</span>
    <button class="btn-secondary" id="btn-auto-save">Auto-saved</button>
    <button class="btn-primary" id="btn-save-run">Save Run →</button>
  </div>

  <div id="confirm-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center">
    <div style="background:var(--bg-raised);border:1px solid var(--border);border-radius:var(--radius);padding:20px;min-width:260px;max-width:320px">
      <p id="confirm-msg" style="margin:0 0 16px;color:var(--text-pri);font-size:13px"></p>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button id="confirm-cancel" class="btn-secondary">Cancel</button>
        <button id="confirm-ok" class="btn-primary" style="background:var(--red);border-color:var(--red)">Clear</button>
      </div>
    </div>
  </div>

  <script src="../scenario-builder/schema.js"></script>
  <script src="../storage/storage.js"></script>
  <script src="../api/api-client.js"></script>
  <script src="popup.js"></script>
</body>
</html>
